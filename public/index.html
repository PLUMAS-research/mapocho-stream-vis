        <div class="splash-texto">Cargando Mapocho</div>
      </div>

    <style>
      .splash-carga { position: fixed; inset: 0; display: flex; flex-direction: column;

        color: #d5d9e0; font-family: -apple-system, system-ui, sans-serif; }
      .splash-spinner { width: 42px; height: 42px; border: 3px solid rgba(255, 255, 255, 0.15);
        border-top-color: #0e7490; border-radius: 50%; animation: splash-giro 0.9s linear infinite; }
      .splash-texto { font-size: 13px; letter-spacing: 0.12em; text-transform: uppercase; }
      @keyframes splash-giro { to { transform: rotate(360deg); } }
    </style>
